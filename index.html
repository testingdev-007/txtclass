<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redress patterns workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ground:#EEF0F6; --surface:#FFFFFF; --head:#E2E6F1; --ink:#182038; --muted:#56607E; --line:#CDD3E4;
  --primary:#2340C8; --on-primary:#FFFFFF; --mark:#FFD84D; --on-mark:#3A2E00;
  --code-bg:#F6F7FB; --code-ink:#1D2540; --code-comment:#6B7594;
  --warn-bg:#FFF4D6; --warn-line:#E5B93C; --ok:#1F7A55;
  --f-head:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#11152A; --surface:#1A2040; --head:#232A4D; --ink:#E7EAF7; --muted:#9BA5C7; --line:#333B63;
    --primary:#8FA2FF; --on-primary:#0E1330; --mark:#FFD84D; --on-mark:#2A2100;
    --code-bg:#0E1226; --code-ink:#DCE1F5; --code-comment:#7F8AB0;
    --warn-bg:#3A3110; --warn-line:#8A7220; --ok:#5FD3A0;
  }
}
:root[data-theme="dark"]{
  --ground:#11152A; --surface:#1A2040; --head:#232A4D; --ink:#E7EAF7; --muted:#9BA5C7; --line:#333B63;
  --primary:#8FA2FF; --on-primary:#0E1330; --mark:#FFD84D; --on-mark:#2A2100;
  --code-bg:#0E1226; --code-ink:#DCE1F5; --code-comment:#7F8AB0;
  --warn-bg:#3A3110; --warn-line:#8A7220; --ok:#5FD3A0;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.7rem;font-weight:700;margin-bottom:.5rem}
h3{font-size:1.1rem;font-weight:600;margin:1.6rem 0 .4rem}
p{margin:.5rem 0;max-width:68ch}
a{color:var(--primary)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:14px 16px 10px;max-width:960px;margin:0 auto}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:.9rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;padding:0 12px;background:var(--head);border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);border-top:0;background:var(--ground);padding:7px 12px 8px;border-radius:0 0 8px 8px;font-size:.92rem;color:var(--muted);white-space:nowrap}
.tab .n{font-family:var(--f-mono);font-size:.78rem;margin-right:4px}
.tab[aria-current="true"]{background:var(--mark);color:var(--on-mark);border-color:var(--mark);font-weight:600}
main{max-width:960px;margin:0 auto;padding:22px 16px 56px}
.lead{font-size:1.08rem;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:inline-block;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);padding:9px 16px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.tiny{padding:4px 10px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:14px 0}
.note{border-left:4px solid var(--warn-line);background:var(--warn-bg);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0;font-size:.95rem}
.note button{margin-left:6px}
.grid{display:grid;gap:12px 16px;grid-template-columns:1fr}
@media(min-width:680px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}
label.f{display:block;font-weight:600;font-size:.92rem}
label.f .hint{display:block;font-weight:400;color:var(--muted);font-size:.84rem;margin-top:1px}
input[type=text],input[type=number],input[type=month],select,textarea{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:400 .95rem var(--f-body)}
textarea{min-height:76px;resize:vertical;font-family:var(--f-mono);font-size:.85rem;line-height:1.45}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.95rem;margin:6px 0}
.chk input{margin-top:5px}
.item{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0;background:var(--surface)}
.item .ctl{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.rxprev{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.bandrow{display:grid;grid-template-columns:1fr 84px 84px auto;gap:8px;align-items:end;margin:8px 0}
@media(max-width:520px){.bandrow{grid-template-columns:1fr 1fr;}.bandrow .lab{grid-column:1/-1}}
table{border-collapse:collapse;font-size:.9rem}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--head)}
.scroll{overflow-x:auto;max-width:100%}
.cell{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:18px 0;overflow:hidden}
.cell-head{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--head);border-bottom:1px solid var(--line)}
.namebox{font:600 .78rem var(--f-mono);border:1px solid var(--line);background:var(--surface);padding:3px 9px;border-radius:3px;white-space:nowrap}
.fx{font:italic 600 .95rem Georgia,serif;color:var(--primary)}
.cell-title{flex:1;min-width:0;font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-meta{padding:8px 12px;font-size:.88rem;color:var(--muted);border-bottom:1px solid var(--line)}
pre.code{margin:0;padding:12px;overflow:auto;max-height:440px;background:var(--code-bg);color:var(--code-ink);font:400 12.5px/1.5 var(--f-mono);white-space:pre;tab-size:4}
pre.code .c{color:var(--code-comment)}
.cell.skip{padding:10px 14px;border-style:dashed}
.cell.skip .cell-title{white-space:normal}
details{margin:10px 0}
summary{cursor:pointer;font-weight:600}
details>*:not(summary){margin-top:8px}
ul.tight{margin:.4rem 0;padding-left:1.2rem}
ul.tight li{margin:.25rem 0;max-width:68ch}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.ok{color:var(--ok);font-weight:600}
.steps-flow{display:grid;gap:8px;margin:12px 0}
.steps-flow div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.steps-flow b{font-family:var(--f-mono);font-size:.85rem;background:var(--mark);color:var(--on-mark);padding:1px 7px;border-radius:3px}
@media(prefers-reduced-motion:no-preference){.tab,.btn{transition:background-color .12s}}

.doit{border:2px solid var(--primary);border-radius:8px;background:var(--surface);padding:12px 18px 6px;margin:16px 0}
.doit ol{margin:.5rem 0 .3rem;padding-left:1.3rem}
.doit li{margin:.4rem 0;max-width:72ch}
.doit .done{margin:.6rem 0;padding-top:.5rem;border-top:1px dashed var(--line)}
.cellno{font:600 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.sheets{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0 12px}
.sheets span{border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;background:var(--head);padding:3px 10px 4px;font-size:.82rem}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Redress patterns workbench</h1>
    <p>From a raw complaints file to subthemes, redress bands and monthly measures</p>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Steps"></nav>
<main id="view"></main>

<script>/*PURE-START*/
const R = String.raw;
const DEF = () => ({
  table:'',
  idCol:'', dateCol:'', redressCol:'',
  wsCol:'', wsVals:'', themeCol:'', themeVals:'',
  textFields:[{col:'',role:'Customer wording',disc:true,cls:true},{col:'',role:'Firm response',disc:true,cls:false}],
  windowMode:'latest', startMonth:'', months:'6',
  bands:[{label:'',lo:'',hi:''},{label:'',lo:'',hi:''},{label:'',lo:'',hi:''}],
  redressPositive:true, minN:'10', modeStep:'5',
  extraStop:'', lemma:'auto', ngramMax:'3', maxFeat:'20000', minDf:'5', topN:'25', k:'10', valPer:'15',
  focus:'data_led', checks:{}
});
const EXAMPLE = () => Object.assign(DEF(), {
  table:'Complaints',
  idCol:'Complaint ID', dateCol:'Date Received', redressCol:'Redress Amount',
  wsCol:'Product', wsVals:'Current Account', themeCol:'Complaint Theme', themeVals:'Fees and charges\nService',
  textFields:[{col:'Complaint Summary',role:'Customer wording',disc:true,cls:true},{col:'Final Response',role:'Firm response',disc:false,cls:false}],
  bands:[{label:'Band 1: up to £99',lo:'0.01',hi:'100'},{label:'Band 2: £100-£499',lo:'100',hi:'500'},{label:'Band 3: £500 and over',lo:'500',hi:''}]
});
const lines = s => String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const csv = s => String(s||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
const cleanPhrase = s => String(s).toLowerCase().replace(/[^a-z]+/g,' ').trim();
const pyStr = s => JSON.stringify(String(s));
const pyList = a => '[' + a.map(pyStr).join(', ') + ']';
const ph = (v,d) => (v && String(v).trim()) ? String(v).trim() : d;
const num = v => { if(v===''||v==null) return null; const n=Number(v); return isFinite(n)?n:null; };
const int = (v,d) => { const n=parseInt(v,10); return isFinite(n)&&n>0?n:d; };
const STOPWORDS = 'a about above after again all also am an and any are as at be because been before being below between both but by can could did do does doing down during each few for from further get got had has have having he her here hers herself him himself his how i if in into is it its itself just me more most my myself of off on once only or other our ours ourselves out over own same she should so some such than that the their theirs them themselves then there these they this those through to too under until up us very was we were what when where which while who whom why will with would you your yours yourself yourselves';
const tf = () => { const a = cfg.textFields.filter(f=>String(f.col).trim()); return a.length ? a.map(f=>({...f,col:f.col.trim()})) : [{col:'Text column',role:'',disc:true,cls:true}]; };
const idxs = key => { const t=tf(); const r=t.map((f,i)=>f[key]?i+1:0).filter(Boolean); return r.length?r:t.map((_,i)=>i+1); };
const bandList = () => { const b=cfg.bands.filter(x=>String(x.label).trim()).map(x=>({label:x.label.trim(),lo:num(x.lo)??0,hi:num(x.hi)})); return b.length?b:[{label:'All redress',lo:0,hi:null}]; };
const extraStop = () => csv(cfg.extraStop).map(cleanPhrase).filter(x=>x&&!x.includes(' '));
const FOCUS_NAMES = {data_led:'the data-led taxonomy', fixed_a:'Fixed A', fixed_b:'Fixed B'};
const focus = () => ['data_led','fixed_a','fixed_b'].includes(cfg.focus)?cfg.focus:'data_led';

/* ---------------- Python cells ---------------- */
function pyLoad(){
  const ws=lines(cfg.wsVals), th=lines(cfg.themeVals), n=int(cfg.months,6);
  const need=['ID_COL','DATE_COL','REDRESS_COL',...(ws.length?['WS_COL']:[]),...(th.length?['THEME_COL']:[])].join(', ');
  const bands=bandList().map(b=>`    (${pyStr(b.label)}, ${b.lo}, ${b.hi==null?'None':b.hi}),`).join('\n');
  const start=cfg.windowMode==='fixed'?cfg.startMonth:'';
  const wsB=ws.length?R`df = df[df[WS_COL].astype(str).str.strip().str.lower().isin([v.strip().lower() for v in WS_VALS])]
steps.append(("Workstream", len(df)))`:'# (no workstream filter set)';
  const thB=th.length?R`df = df[df[THEME_COL].astype(str).str.strip().str.lower().isin([v.strip().lower() for v in THEME_VALS])]
steps.append(("Theme", len(df)))`:'# (no theme filter set)';
  const pos=cfg.redressPositive?R`df = df[df["redress"] > 0]
steps.append(("Redress above zero", len(df)))`:'# (redress > 0 filter switched off)';
  return R`import pandas as pd, numpy as np, re

# ---- Your settings (generated from the workbench) ----
ID_COL       = ${pyStr(ph(cfg.idCol,'Complaint ID'))}
DATE_COL     = ${pyStr(ph(cfg.dateCol,'Date'))}
REDRESS_COL  = ${pyStr(ph(cfg.redressCol,'Redress'))}
WS_COL       = ${pyStr(ph(cfg.wsCol,''))}
WS_VALS      = ${pyList(ws)}
THEME_COL    = ${pyStr(ph(cfg.themeCol,''))}
THEME_VALS   = ${pyList(th)}
TEXT_COLS    = ${pyList(tf().map(f=>f.col))}
N_MONTHS     = ${n}
WINDOW_START = ${pyStr(start)}   # "" means: the latest N_MONTHS found in the data
# (label, lower bound inclusive, upper bound exclusive or None)
BANDS = [
${bands}
]
BAND_ORDER = [b[0] for b in BANDS]

raw = xl(${pyStr(ph(cfg.table,'Complaints')+'[#All]')}, headers=True)   # the Excel table holding your complaints
needed = [${need}, *TEXT_COLS]
missing = [c for c in needed if c not in raw.columns]
assert not missing, f"Column(s) not found in the table: {missing}. Columns available: {list(raw.columns)}"

# ---- Scope, one filter at a time, counting rows as we go ----
df = raw.copy()
steps = [("All rows", len(df))]
${wsB}
${thB}
df["redress"] = pd.to_numeric(df[REDRESS_COL].astype(str).str.replace(r"[£,\s]", "", regex=True), errors="coerce")
df = df[df["redress"].notna()]
steps.append(("Redress readable as a number", len(df)))
${pos}
df["theme"] = df[THEME_COL].astype(str).str.strip() if THEME_COL else "(all)"   # the complaint theme, carried through unchanged
df["date"] = pd.to_datetime(df[DATE_COL], errors="coerce", dayfirst=True)
df = df[df["date"].notna()]
steps.append(("Date readable", len(df)))

# ---- Month window ----
df["month"] = df["date"].dt.to_period("M")
first = pd.Period(WINDOW_START, freq="M") if WINDOW_START else df["month"].max() - (N_MONTHS - 1)
WINDOW = [str(first + i) for i in range(N_MONTHS)]
df["month"] = df["month"].astype(str)
df = df[df["month"].isin(WINDOW)].reset_index(drop=True)
steps.append((f"In window {WINDOW[0]} to {WINDOW[-1]}", len(df)))

# ---- Redress bands ----
def band_of(x):
    for label, lo, hi in BANDS:
        if x >= lo and (hi is None or x < hi):
            return label
    return "Unbanded"
df["band"] = df["redress"].map(band_of)

funnel = pd.DataFrame(steps, columns=["step", "rows"])
funnel["dropped"] = (funnel["rows"].shift(1) - funnel["rows"]).fillna(0).astype(int)
funnel`;
}

function pyBandCheck(){
  return R`chk = (df.groupby("band")["redress"]
         .agg(complaints="size", min="min", max="max", mean="mean", median="median")
         .reindex(BAND_ORDER + ["Unbanded"]).dropna(how="all").round(2).reset_index())
chk["share"] = (chk["complaints"] / len(df)).round(3)
chk   # "Unbanded" should be empty. If not, your band edges leave a gap.`;
}

function pyLemma(){
  const N=tf().length;
  return R`from collections import Counter, defaultdict

STOP = set("${STOPWORDS}".split()) | set(${pyList(extraStop())})
# Negations (no, not, never, nor, cannot, without) are deliberately NOT stop words.
LEMMA_MODE = ${pyStr(cfg.lemma==='dict'?'dictionary':'auto')}   # "auto" tries WordNet first, "dictionary" never does

freq = Counter(w for i in range(1, ${N}+1) for t in df[f"clean_{i}"] for w in t.split())

SUFFIXES = ("ations", "ation", "ings", "ing", "ies", "ied", "ers", "er", "ed", "es", "s")
def stem_key(w):
    if len(w) > 3:
        for suf in SUFFIXES:
            if suf == "s" and w.endswith("ss"):
                continue
            if w.endswith(suf) and len(w) - len(suf) >= 3:
                w = w[:-len(suf)]
                break
    return w[:-1] if w.endswith("e") and len(w) > 3 else w

def build_canon(freq):
    if LEMMA_MODE == "auto":
        try:
            from nltk.stem import WordNetLemmatizer
            wn = WordNetLemmatizer()
            wn.lemmatize("charges")            # raises if the WordNet data is not available
            return {w: wn.lemmatize(wn.lemmatize(w, "v"), "n") for w in freq}, "WordNet lemmatiser"
        except Exception:
            pass
    groups = defaultdict(list)                 # fallback: group by a light stem, show the commonest real word
    for w, n in freq.items():
        groups[stem_key(w)].append((n, w))
    canon = {}
    for members in groups.values():
        best = max(members)[1]
        for _, w in members:
            canon[w] = best
    return canon, "suffix rules + commonest form"

CANON, METHOD = build_canon(freq)
def normalise(t):
    return " ".join(CANON.get(w, w) for w in t.split() if len(w) > 1 and w not in STOP)

for i in range(1, ${N}+1):
    df[f"norm_{i}"] = df[f"clean_{i}"].map(normalise)
NORM_DISC = [f"norm_{i}" for i in ${JSON.stringify(idxs('disc'))}]     # fields used for discovery
df["disc_text"] = df[NORM_DISC].agg(" ".join, axis=1)

pd.DataFrame({"check": ["Lemmatising method", "Distinct words before", "Distinct words after",
                        "Complaints with no usable text (classify)", "Complaints with no usable text (discover)"],
              "value": [METHOD, len(freq), len(set(CANON.values())),
                        int((df["cls_text"].str.strip() == "").sum()), int((df["disc_text"].str.strip() == "").sum())]})`;
}

function pyTerms(){
  return R`from sklearn.feature_extraction.text import TfidfVectorizer, CountVectorizer

NGRAM_MAX    = ${int(cfg.ngramMax,3)}      # longest phrase: 3 = up to three words
MAX_FEATURES = ${int(cfg.maxFeat,20000)}   # cap the vocabulary so 25k rows stay fast
MIN_DF       = ${int(cfg.minDf,5)}         # ignore phrases in fewer than this many complaints
TOP_N        = ${int(cfg.topN,25)}         # rows shown per phrase length

vec = TfidfVectorizer(ngram_range=(1, NGRAM_MAX), min_df=MIN_DF, max_features=MAX_FEATURES, sublinear_tf=True)
X = vec.fit_transform(df["disc_text"])
terms = np.array(vec.get_feature_names_out())
docs = np.asarray((X > 0).sum(axis=0)).ravel()
tbl = pd.DataFrame({"term": terms, "words": [t.count(" ") + 1 for t in terms], "complaints": docs,
                    "share": (docs / X.shape[0]).round(3),
                    "avg_tfidf": np.asarray(X.mean(axis=0)).ravel().round(4)})
top_terms = (tbl.sort_values("complaints", ascending=False)
                .groupby("words").head(TOP_N).sort_values(["words", "complaints"], ascending=[True, False])
                .reset_index(drop=True))
top_terms`;
}

function pyBandTerms(){
  return R`share_all = docs / X.shape[0]
TOP_PER_BAND = 15
rows = []
for b in BAND_ORDER:
    m = (df["band"] == b).to_numpy()
    if m.sum() < ${int(cfg.minN,10)}:
        continue
    share_b = np.asarray((X[m] > 0).mean(axis=0)).ravel()
    lift = np.where(share_b >= 0.02, share_b / (share_all + 1e-9), 0)   # in at least 2% of the band's complaints
    for j in np.argsort(-lift)[:TOP_PER_BAND]:
        if lift[j] > 0:
            rows.append((b, int(m.sum()), terms[j], round(float(share_b[j]), 3), round(float(lift[j]), 1)))
band_terms = pd.DataFrame(rows, columns=["band", "complaints_in_band", "term", "share_in_band", "lift_vs_all"])
band_terms`;
}

function pyColloc(){
  return R`cv = CountVectorizer(ngram_range=(1, 2), min_df=MIN_DF)
C = cv.fit_transform(df["disc_text"])
names = cv.get_feature_names_out()
counts = np.asarray(C.sum(axis=0)).ravel()
uni = {t: c for t, c in zip(names, counts) if " " not in t}
N_TOK = sum(uni.values())
rows = []
for t, c in zip(names, counts):
    if " " in t and c >= 10:
        a, b = t.split(" ")
        if a in uni and b in uni:
            pmi = np.log2((c / N_TOK) / ((uni[a] / N_TOK) * (uni[b] / N_TOK)))
            rows.append((t, int(c), round(float(pmi), 2)))
colloc = pd.DataFrame(rows, columns=["phrase", "count", "pmi"]).sort_values("pmi", ascending=False).head(50).reset_index(drop=True)
colloc   # high pmi = the words really belong together (a genuine phrase)`;
}

function pyFields(){
  return R`out = {}
for i, c in enumerate(TEXT_COLS, start=1):
    cvi = CountVectorizer(ngram_range=(1, 2), min_df=MIN_DF, max_features=5000)
    Xi = cvi.fit_transform(df[f"norm_{i}"])
    nm = cvi.get_feature_names_out()
    n = np.asarray((Xi > 0).sum(axis=0)).ravel()
    out[c] = pd.Series([f"{nm[j]} ({n[j]})" for j in np.argsort(-n)[:30]])

function pyClean(){

def clean_phrase(x):

# ---- Synonyms sheet: table "Synonyms" with columns Keep and Same as ----
syn = read_table(lambda: xl("Synonyms[#All]", headers=True))
SYN_GROUPS = []
if syn is not None and {"Keep", "Same as"} <= set(syn.columns):
    for keep, same in zip(syn["Keep"], syn["Same as"]):
        if pd.isna(keep) or pd.isna(same):
            continue
        canon = clean_phrase(keep)
        syns = sorted({clean_phrase(x) for x in re.split(r"[,;\n]+", str(same))} - {"", canon}, key=len, reverse=True)
        if canon and syns:
            SYN_GROUPS.append((canon, syns))
SYN_RX = [(re.compile(r"\b(?:" + "|".join(map(re.escape, syns)) + r")\b"), canon) for canon, syns in SYN_GROUPS]

BOILERPLATE = []
if bp is not None and "Phrase" in bp.columns:
    BOILERPLATE = [p for p in (clean_phrase(x) for x in bp["Phrase"].dropna()) if p]
BOILER_RX = [re.compile(r"\b" + re.escape(p) + r"\b") for p in BOILERPLATE]

def clean_text(t):
    t = str(t).lower()
    t = re.sub(r"\S+@\S+", " ", t)                              # email addresses
    t = re.sub(r"\b[a-z]{1,3}\d{5,}\b|\b\d{5,}\b", " ", t)      # reference and account numbers
    t = re.sub(r"[^a-z]+", " ", t).strip()                      # letters only
    for rx in BOILER_RX:

    for rx, canon in SYN_RX:

    return re.sub(r"\s+", " ", t).strip()

function pyTaxonomies(){
  return R`# Reads your three taxonomy tables from the workbook: DataLed, FixedA, FixedB. Each has the columns
# Theme, Reference category, Subtheme, Keywords, Notes. Missing tables are fine: that taxonomy is simply not used.
OTHER = "Other / unclassified"
NEEDED = ["Theme", "Reference category", "Subtheme", "Keywords"]

def term_regex(term):
    """Turn one keyword into a pattern that also catches plurals and -ed/-ing forms. word* catches any ending."""
    t = re.sub(r"[^a-z\s*]", " ", str(term).lower())
    t = re.sub(r"\s+", " ", t).strip()
    for rx, canon in SYN_RX:
        t = rx.sub(canon, t)                       # keywords use the same synonyms as the complaint text
    words = [w for w in t.split(" ") if w.replace("*", "")]
    if not words:
        return None
    parts = []
    for i, w in enumerate(words):
        b = w.replace("*", "")
        if "*" in w:
            parts.append(re.escape(b) + r"\w*")
        elif i < len(words) - 1:
            parts.append(re.escape(b))
        else:
            base = b[:-1] if (b.endswith("e") and len(b) > 4) else b
            parts.append(re.escape(base) + r"(?:e|es|ed|ing|s)?")
    return r"\b" + r"\s+".join(parts) + r"\b"

def cell(v):
    return "" if pd.isna(v) else str(v).strip()

def build_rules(tdf):
    """Return (rules, problems). A rule is (subtheme, reference category, theme, [(keyword, pattern), ...])."""
    rules, problems = [], []
    if tdf is None:
        return rules, ["table not found (fine if you are not using this taxonomy)"]
    missing = [c for c in NEEDED if c not in tdf.columns]
    if missing:
        return rules, [f"missing column(s) {missing}; found {list(tdf.columns)}"]
    seen = set()
    for n, (_, r) in enumerate(tdf.iterrows(), start=2):          # row 1 is the header
        name, kws = cell(r["Subtheme"]), cell(r["Keywords"])
        if not name and not kws:
            continue                                              # blank row
        if not name:
            problems.append(f"row {n}: keywords but no Subtheme name"); continue
        items = []
        for k in re.split(r"[,;\n]+", kws):
            k = k.strip().strip('"')
            rx = term_regex(k) if k else None
            if rx:
                items.append((k, rx))
        if not items:
            problems.append(f"row {n} ({name}): no usable keywords"); continue
        if name.lower() in seen:
            problems.append(f"row {n}: '{name}' appears twice (fine only if the Theme differs)")
        seen.add(name.lower())
        rules.append((name, cell(r["Reference category"]) or "Unmapped", cell(r["Theme"]), items))
    return rules, problems

TABLES = {
    "data_led": read_table(lambda: xl("DataLed[#All]", headers=True)),
    "fixed_a": read_table(lambda: xl("FixedA[#All]", headers=True)),
    "fixed_b": read_table(lambda: xl("FixedB[#All]", headers=True)),
}
RULESETS, rows = {}, []
for key, tdf in TABLES.items():
    RULESETS[key], problems = build_rules(tdf)
    rows.append({"what": key, "found": "yes" if tdf is not None else "NO", "subthemes": len(RULESETS[key]),
                 "keywords": sum(len(r[3]) for r in RULESETS[key]), "problems": "; ".join(problems) or "none"})
rows.append({"what": "synonyms", "found": "yes" if syn is not None else "no (optional)", "subthemes": len(SYN_GROUPS),
             "keywords": sum(len(g[1]) for g in SYN_GROUPS), "problems": "none"})
rows.append({"what": "boilerplate phrases", "found": "yes" if bp is not None else "no (optional)", "subthemes": "",
             "keywords": len(BOILERPLATE), "problems": "none"})

def apply_rules(rules, texts, themes):
    comp = [(th.lower(), [re.compile(rx) for _, rx in items]) for _, _, th, items in rules]
    return [[i for i, (th, pats) in enumerate(comp) if (not th or th == t) and any(p.search(x) for p in pats)]
            for x, t in zip(texts, themes)]

pd.DataFrame(rows)   # "subthemes" is the number of rows read; "keywords" the number of keywords across them`;
}
function pyApply(){
  return R`FOCUS = ${pyStr(focus())}     # the taxonomy you are working on: "data_led", "fixed_a" or "fixed_b"

# Every complaint gets one label per taxonomy: the FIRST row (top to bottom) whose keywords match.
# The label columns are data_led, fixed_a and fixed_b. The *_ref columns hold the reference category, *_all lists every match.
for key, rules in RULESETS.items():
    hits = pd.Series(apply_rules(rules, df["cls_text"], df["theme"].str.lower()), index=df.index, dtype=object)
    first = hits.map(lambda h: h[0] if h else -1)
    df[key] = first.map(lambda i, r=rules: r[i][0] if i >= 0 else OTHER)
    df[key + "_ref"] = first.map(lambda i, r=rules: r[i][1] if i >= 0 else "Unmapped")
    df[key + "_all"] = hits.map(lambda h, r=rules: " | ".join(r[i][0] for i in h))

all_other = (df[list(RULESETS)] == OTHER).all(axis=1)

function pyMeasureSetup(){
  return R`MIN_N = ${int(cfg.minN,10)}         # suppress statistics for groups smaller than this
MODE_STEP = ${int(cfg.modeStep,5)}       # round redress to the nearest £${int(cfg.modeStep,5)} before finding the mode
MEASURE_BY = ${pyStr(focus())}   # which taxonomy the tables below use: "data_led", "fixed_a" or "fixed_b"

def mode_of(s):
    r = ((s / MODE_STEP).round() * MODE_STEP).value_counts()

def mode_share(s):
    r = ((s / MODE_STEP).round() * MODE_STEP).value_counts()

def trim_mean(s, p=0.1):

STATS = ["mean", "median", "mode", "mode_share", "trimmed_mean", "p75", "p90"]

build(["subtheme"]).sort_values("volume", ascending=False).reset_index(drop=True)   # whole window, by subtheme`;

const colLetter = n => { let s='',k=n+1; while(k>0){const m=(k-1)%26; s=String.fromCharCode(65+m)+s; k=Math.floor((k-1)/26);} return s; };
function load(){

const getP = p => p.split('.').reduce((o,k)=>o==null?o:o[k],cfg);
function setP(p,v){ const ks=p.split('.'); let o=cfg; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v; }

function hl(text){
  return text.split('\n').map(l=>{
    let q=null,cut=-1;
    for(let i=0;i<l.length;i++){ const ch=l[i];
      if(q){ if(ch==='\\'){i++;continue;} if(ch===q) q=null; }
      else if(ch==='"'||ch==="'") q=ch;
      else if(ch==='#'){cut=i;break;}
    }
    return cut<0?esc(l):esc(l.slice(0,cut))+'<span class="c">'+esc(l.slice(cut))+'</span>';
  }).join('\n');
}
function missing(){
  const m=[];

  return m;
}

function cellHtml(key,c,i,n){

};
const COPILOT={
  dl:()=>`I am building a taxonomy of complaint subthemes from clusters. Below are clusters from an analysis of ${ph(lines(cfg.wsVals).join(' / '),'[product]')} complaints where redress was paid. For each cluster I have its top words and three typical complaints (anonymised, with names, addresses and account numbers removed).

For each cluster, give me:
1. A short subtheme name and a one-line definition.
2. Whether it looks like two issues mixed together, and if so how to split it.
3. 5 to 10 keywords or phrases in the customers' own wording that would identify it.

[paste the cluster terms and typical complaints here]`,
  classify:()=>`Here are my subthemes and their keywords for one taxonomy:

[paste the taxonomy table here]

Below are 30 anonymised complaints that my rules put in "Other / unclassified". For each one, say which existing subtheme it belongs in, or propose a new subtheme. Then list the keywords or phrases I should add to each subtheme so these would be caught next time.

[paste 30 anonymised complaints here]`
};
function codeStep(key){
  const I=INTRO[key];
  const settings = key==='dl' ? `<details open><summary>Settings for these cells</summary><div class="grid three">
      ${inp('Number of clusters','k',{ph:'10'})}${inp('Longest phrase (words)','ngramMax',{ph:'3'})}${inp('Ignore phrases in fewer than … complaints','minDf',{ph:'5'})}
      ${inp('Vocabulary cap','maxFeat',{ph:'20000'})}${inp('Rows shown per phrase length','topN',{ph:'25'})}</div>
      <p class="small muted">After changing a setting, copy the affected cell here again and paste it over the old one.</p></details>`
    : key==='classify' ? `<details open><summary>Settings for these cells</summary>${focusSelect()}<div class="grid three" style="margin-top:8px">${inp('Complaints to label per subtheme','valPer',{ph:'15'})}</div></details>`
    : key==='measure' ? `<details open><summary>Settings for these cells</summary>${focusSelect()}</details>` : '';
  const cp=COPILOT[key]?`<h3>Ask Copilot for a second opinion</h3><p class="small muted">Use anonymised samples only, and only if your firm allows complaint text in Copilot chat.</p>
    <div class="cell"><div class="cell-head"><span class="cell-title">Copilot chat prompt</span><button class="btn ghost tiny" data-copy="cp.${key}">Copy</button></div><pre class="code" data-cp="${key}" style="white-space:pre-wrap"></pre></div>`:'';
  return `<h2>${I.h}</h2><p class="lead">${I.p}</p>
  ${doit(I.do,I.done)}
  ${missBanner()}
  ${cellsBlock(key)}${settings}${cp}
  ${key==='dl'?`<div class="note">When the DataLed table is ready, move on to fix your own two taxonomies. <button class="btn tiny" data-go="4">Go to Fixed</button></div>`:''}
  <details><summary>How to read the results</summary><ul class="tight">${I.read.map(r=>`<li>${r}</li>`).join('')}</ul></details>`;
}

/* ---------- Fixed ---------- */
function renderFixed(){
  const head=EXT.cols;
  return `<h2>Fixed taxonomies</h2>
  <p class="lead">These are two sets of categories that you write yourself. They live in Excel, on the sheets <strong>FixedA</strong> and <strong>FixedB</strong>, in exactly the format below. The data-led one from step 4 uses the same format.</p>
  ${doit(['Open the <strong>FixedA</strong> sheet. Fill the table in the format below, one row per subtheme.','Do the same on <strong>FixedB</strong> if you have a second set, for example reference categories. If you do not, leave the example rows out and it is simply not used.','If you want, fill <strong>Synonyms</strong> and <strong>Boilerplate</strong> (formats below). They are optional.','Make a sheet called <strong>Taxonomies</strong>, paste the cell at the bottom of this page and run it.','Read the report. Fix anything in the problems column, then check it again.'],'every table you use shows found &ldquo;yes&rdquo; and problems &ldquo;none&rdquo;.')}
  <h3>The format</h3>
  <p>Every taxonomy table has exactly these five columns, with this exact header row. Do not rename the headers.</p>
  ${tbl(['Column','Required','What to put','Example'],[
    ['Theme','No','An exact value from your theme column. The row then only applies to complaints with that theme. Blank means every theme.','Fees and charges'],
    ['Reference category','No','The wider category this subtheme rolls up to.','Charges'],
    ['Subtheme','Yes','A short name for what went wrong.','Charge not explained'],
    ['Keywords','Yes','Words or phrases separated by commas, in the customer’s own wording. Add * for any ending. Plurals and -ed/-ing forms are automatic.','not told, no warning, unexpected charge'],
    ['Notes','No','Anything you like. The code ignores this column.','']],[0,1,2,3])}
  <h3>What it looks like: FixedA</h3>
  <p class="small muted">This is what the FixedA sheet contains in the example workbook. The Notes column explains each row.</p>
  ${tbl(head,EXT.fixedA,[0,1,2,3,4])}
  <h3>What it looks like: FixedB</h3>
  <p class="small muted">A second, broader set. Same columns. It gets its own label on every complaint.</p>
  ${tbl(head,EXT.fixedB,[0,1,2,3,4])}
  <h3>Rules that make it work</h3>
  <ul class="tight">
    <li><strong>Order matters within a table.</strong> Rows are checked top to bottom. The first row whose keywords match sets that taxonomy&rsquo;s label. Put specific subthemes above general ones.</li>
    <li><strong>Each taxonomy labels every complaint on its own.</strong> A complaint gets one label from DataLed, one from FixedA and one from FixedB, plus the Theme it already had.</li>
    <li><strong>Use the customer&rsquo;s wording.</strong> Write &ldquo;not told&rdquo;, not &ldquo;lack of disclosure&rdquo;. Aim for 5 to 15 keywords per row.</li>
    <li><strong>Avoid words that appear in almost every complaint.</strong> One of them will claim everything.</li>
    <li>Keywords are matched against the cleaned text, so use the words you keep in Synonyms (for example <em>charge</em>, not <em>fee</em>).</li>
  </ul>
  <h3>How a complaint gets labelled</h3>
  ${tbl(['Complaint','Theme','data_led','fixed_a','fixed_b'],[
    ['“Not told about the monthly fee”','Fees and charges','(no match)','Charge not explained','Charges and fees'],
    ['“Letter never arrived, chased twice”','Service','Letters and paperwork','Delay to refund','Contact and communication'],
    ['“App kept crashing”','Service','(no match)','(no match)','Everyday service']],[0,1,2,3,4])}
  <p class="small muted">Different taxonomies can disagree. That is the point: you can measure the same complaints under each and compare.</p>
  <h3>The two optional cleaning tables</h3>
  <div class="grid two">
    <div><strong>Synonyms</strong><p class="small muted">Columns <em>Keep</em> and <em>Same as</em>. Every word in Same as is replaced by the Keep word in the complaint text and in your keywords.</p>
      ${tbl(['Keep','Same as'],EXT.synonyms,[0,1])}</div>
    <div><strong>Boilerplate</strong><p class="small muted">One column called <em>Phrase</em>. Each phrase is deleted from the complaint text.</p>
      ${tbl(['Phrase'],EXT.boiler,[0])}</div>
  </div>
  <h3>Check your tables</h3>
  ${missBanner()}
  ${cellsBlock('fixed')}
  <details><summary>How to read the report</summary><ul class="tight">
    <li><strong>found NO</strong> means Excel has no table with that name. Check the sheet and the Table Design name. It is fine for DataLed and FixedB if you are not using them.</li>
    <li><strong>subthemes</strong> counts the rows that were read. If it is lower than you expect, look at the problems column.</li>
    <li><strong>problems</strong> lists row numbers counting the header as row 1.</li></ul></details>`;
}

function allPy(){
  const parts=[]; ['prep','dl','fixed','classify','measure'].forEach(k=>{ CELLS[k].filter(c=>!c.show||c.show()).forEach((c,i)=>{ parts.push(`# ${'='.repeat(70)}\n# ${SHEET[k]}!${colLetter(i*13)}1  |  ${c.title}\n# ${'='.repeat(70)}\n${c.py()}`); }); });
  return parts.join('\n\n');
}
function renderFinish(){
  const m=missing();
  return `<h2>Finish</h2>
  <p class="lead">A checklist for sanity-checking the numbers before anyone sees them, and everything in one place.</p>
  <div class="panel"><strong>Your setup</strong>
    <ul class="tight small"><li>${esc(ph(cfg.table,'(table not set)'))}: ${esc(ph(cfg.idCol,'?'))}, ${esc(ph(cfg.dateCol,'?'))}, ${esc(ph(cfg.redressCol,'?'))}</li>
    <li>${tf().length} text field${tf().length>1?'s':''}, ${bandList().length} redress band${bandList().length>1?'s':''}, ${int(cfg.months,6)} months, minimum group ${int(cfg.minN,10)}, working on ${esc(FOCUS_NAMES[focus()])}</li></ul>
    ${m.length?`<p class="small">Still blank: ${esc(m.join(', '))}. <button class="btn ghost tiny" data-go="1">Fill in</button></p>`:'<p class="small ok">All key settings are filled in.</p>'}</div>
  <h3>Sanity checks before you share</h3>
  <ul class="tight">
    <li>Volumes in the month view add up to the last line of the row funnel.</li>
    <li>Other / unclassified is under about 10% in the taxonomy you report on, or you can say why it is not.</li>
    <li>Each subtheme agrees with your hand labels at about 80% or better, and you know which pairs get confused.</li>
    <li>You have reported medians alongside means, and said which groups were blanked for being too small.</li>
    <li>A mode share above 20% has been explained (standard payment, cap, or tariff).</li>
    <li>You have written down the version and date of each taxonomy table, so next month uses the same rules.</li>
  </ul>
  <h3>Everything in one script</h3>
  <p class="small muted">Handy for review. In Excel, keep the Python as separate cells so heavy steps do not rerun every time you edit.</p>
  <details><summary>All Python cells in order</summary><div class="cell"><div class="cell-head"><span class="cell-title">All Python cells</span><button class="btn ghost tiny" data-copy="all.py">Copy</button></div><pre class="code" data-all="py" tabindex="0"></pre></div></details>
  <h3>Keep or move your settings</h3>
  <p class="small muted">Settings stay in this browser. To use them on another machine, copy them here and paste them there.</p>
  <div class="row"><button class="btn ghost" data-copy="cfg">Copy my settings</button><button class="btn ghost" data-act="loadCfg">Load pasted settings</button></div>
  <textarea id="cfgbox" placeholder="Paste settings here, then choose Load pasted settings" spellcheck="false"></textarea>
  <div class="row"><button class="btn ghost" data-act="example">Fill in settings for the example workbook</button><button class="btn ghost" data-act="reset">Clear everything</button></div>`;
}

/* ---------- events ---------- */
function onEdit(e){
  const t=e.target, p=t.dataset&&t.dataset.bind; if(!p) return;
  if(t.type==='radio'){ if(!t.checked) return; setP(p,t.value); save(); if(p==='windowMode'){render();return;} refresh(); return; }
  setP(p,t.type==='checkbox'?t.checked:t.value); save(); refresh();
}
document.addEventListener('input',onEdit); document.addEventListener('change',onEdit);
function selectNode(n){ try{ const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }catch(e){} }
async function copyText(text,btn,node){
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(_){}
  }
  const old=btn.textContent; btn.textContent=ok?'Copied':'Select and copy'; if(!ok&&node) selectNode(node);
  setTimeout(()=>{btn.textContent=old;},1600);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.go!=null){ step=+t.dataset.go; render(); window.scrollTo(0,0); return; }
  if(t.dataset.copy){
    const k=t.dataset.copy; let node,text;
    if(k==='cfg'){ text=JSON.stringify(cfg); }
    else if(k.startsWith('cp.')){ node=$(`pre[data-cp="${k.slice(3)}"]`); text=node.textContent; }
    else if(k.startsWith('all.')){ node=$(`pre[data-all]`); text=node.textContent; }
    else { node=$(`pre[data-cell="${k}"]`); text=node.textContent; }
    copyText(text,t,node); return;
  }
  const a=t.dataset.act; if(!a) return; const i=+t.dataset.i;
  if(a==='addTf') cfg.textFields.push({col:'',role:'Other',disc:true,cls:false});
  else if(a==='delTf') cfg.textFields.splice(i,1);
  else if(a==='addBand') cfg.bands.push({label:'',lo:'',hi:''});
  else if(a==='delBand') cfg.bands.splice(i,1);
  else if(a==='example'){ cfg=EXAMPLE(); }
  else if(a==='reset'){
    if(!t.dataset.armed){ const old=t.textContent; t.dataset.armed='1'; t.textContent='Click again to clear everything'; setTimeout(()=>{ delete t.dataset.armed; t.textContent=old; },3000); return; }
    cfg=DEF();
  }
  else if(a==='loadCfg'){
    try{ cfg=Object.assign(DEF(),JSON.parse($('#cfgbox').value)); }
    catch(_){ const old=t.textContent; t.textContent='Those are not valid settings'; setTimeout(()=>{ t.textContent=old; },2500); return; }
  }
  render();
});
load(); render();

</script>
